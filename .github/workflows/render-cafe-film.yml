name: Render Cafe Trial MP4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "remotion.config.ts"
      - ".github/workflows/render-cafe-film.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Render 8-second 3D cafe trial
        run: npx remotion render src/index.ts CafeTrial out/cafe-trial.mp4 --gl=swangle
      - name: Render concept board (3 cafes + 3 character styles)
        run: npx remotion render src/index.ts CafeConcepts out/cafe-concepts.mp4 --gl=swangle
      - name: Commit rendered previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/cafe-trial.mp4 out/cafe-concepts.mp4
          if git diff --cached --quiet; then
            echo "No rendered trial changes."
          else
            git commit -m "Render cafe and character concept options"
            git push
          fi
